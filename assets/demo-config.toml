workspaces = []
schedules = []

[general]
backend = "swww"
cache_max_mb = 500

[display]
mode = "random_startup"
interval = "30m"
min_resolution = "auto"
aspect_ratio = "auto"

[display.transition]
type = "fade"
duration = 2.0
fps = 60

[[sources.feeds]]
enabled = true
name = "Landscapes"
url = "https://www.reddit.com/r/ImaginaryLandscapes/.rss"

[sources.wallhaven]
enabled = true
categories = "100"
purity = "100"

[sources.unsplash]
enabled = false

[sources.pexels]
enabled = false

# Booru sources (anime/NSFW track) — one [[sources.booru]] per host.
#   name   = per-host identity (also the dedup key). Known hosts only for now:
#            danbooru, yandere, konachan.
#   flavor = API dialect: "danbooru" or "moebooru" (yande.re + Konachan).
# All disabled by example. Nothing NSFW can surface until you BOTH enable a
# source AND raise [general] content_safety above "safe" (see issue #7 docs):
# at the default "safe" ceiling every booru is forced to its safest rating.
#
# [[sources.booru]]
# enabled = false
# name = "danbooru"
# flavor = "danbooru"
#
# [[sources.booru]]
# enabled = false
# name = "yandere"
# flavor = "moebooru"
#
# [[sources.booru]]
# enabled = false
# name = "konachan"
# flavor = "moebooru"

[filter]
min_width = 1920
min_height = 1080
exclude_tags = []
