# The Ultrawide Source parses markup it does not own. Its offline fixtures are
# frozen on their capture date, so the suite goes on passing however far the
# site moves. This job is the only thing that asks the live site the question.
#
# Deliberately NOT part of CI: it reaches the network, so it never runs on push
# or pull request, and `cargo test --workspace` stays offline and deterministic.
# One window of the gallery endpoint per run, one gallery page, plus four
# one-byte verification requests, weekly, all identifying muralis — the Access
# posture the Source keeps at runtime applies to its monitoring too.
#
# "Did anything parse?" is not the question it asks. The Source once shipped
# reading `src` on a page that lazy-loads, and every Preview it produced carried
# a 1x1 placeholder: a full complement of cards, none of them usable. So the
# check asks whether what parsed is usable, and its report names which question
# failed — cards-present, fields-usable, card-count, tag-vocabulary, urls-resolve
# or urls-refused. The sampled master is fetched exactly as the Source fetches
# one, referer included, so the site's hotlink gate fails this check rather than
# waiting for a user who cannot keep a wallpaper; urls-refused is that gate
# having moved, and is never a rate limit, which stays transient.
#
# tag-vocabulary is the one the markup cannot answer: the endpoint returns an
# empty fragment for a tag it does not know, exactly as it does for a real tag
# with nothing in it, so a shipped tag the site has dropped reads to a user as
# "nothing found". Catching that weekly beats catching it by report.
name: Ultrawide drift check

on:
  schedule:
    # Mondays, 06:17 UTC. Weekly is a health check; anything denser is a crawl.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to check
        required: false
        default: Dark

permissions:
  contents: read
  issues: write

concurrency:
  group: ultrawide-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || 'Dark' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev

      - name: Build the check
        # Built separately so the run below emits nothing but the report, and
        # its exit code is the check's own.
        run: cargo build --quiet -p muralis-source-ultrawide --example drift-check

      - name: Fetch one window and ask whether the production parser still yields usable cards
        id: check
        run: |
          set +e
          report=$(./target/debug/examples/drift-check "$TAG")
          code=$?
          set -e
          echo "$report"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          {
            echo 'report<<DRIFT_REPORT_EOF'
            echo "$report"
            echo 'DRIFT_REPORT_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "$report" >> "$GITHUB_STEP_SUMMARY"

      # Drift, and only drift, is filed: a page arrived intact and what the
      # parser made of it is not usable. Refreshing the fixture stays a human
      # decision — a new capture is a new parser contract — so nothing here
      # commits anything.
      - name: File the drift where a maintainer will see it
        if: steps.check.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.check.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Ultrawide Source: the live gallery no longer answers tag '$TAG' usably"
          body=$(printf '%s\n\n---\nFound by the weekly drift check: %s\n\nRefreshing the fixture is a human decision — a new capture is a new parser contract.\n' "$REPORT" "$RUN_URL")
          existing=$(gh issue list --state open --search "in:title $title" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label bug --body "$body"
          fi
          exit 1

      # A timeout, a 5xx or a rate limit — on the page or on a verification
      # request — says nothing about the markup. Visible as a failed run, but
      # never filed and never called drift.
      - name: Report a transient failure without calling it drift
        if: steps.check.outputs.code == '2'
        env:
          REPORT: ${{ steps.check.outputs.report }}
        run: |
          echo "::warning title=Ultrawide drift check could not reach the site::$REPORT"
          echo 'Transient: no issue filed, and no conclusion drawn about the markup.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
